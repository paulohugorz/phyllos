<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Solicitação recebida | Vereda</title>
  <link rel="icon" type="image/png" href="../assets/brand/vereda-wordmark-v2-referencia-raster.png">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="thank-you" data-submission-received>
    <a class="brand" href="../index.html" aria-label="Vereda — início">
      <img src="../assets/brand/vereda-wordmark-v2-referencia-raster.png" width="477" height="96" alt="Vereda">
    </a>
    <div>
      <p class="section-index">Solicitação recebida</p>
      <h1>Obrigada por compartilhar o contexto da sua empresa.</h1>
      <p>Usaremos o e-mail informado para continuar a conversa sobre requisitos, dados disponíveis e próximos passos.</p>
      <a class="button" href="../index.html">Voltar à página inicial</a>
    </div>
  </main>
  <style>
    .thank-you { min-height: 100vh; width: min(calc(100% - 3rem), 56rem); margin: 0 auto; padding: 3rem 0; display: grid; align-content: space-between; gap: 8rem; }
    .thank-you > div { max-width: 46rem; }
    .thank-you h1 { max-width: 15ch; }
    .thank-you p:not(.section-index) { max-width: 40rem; color: var(--grafite); font-size: 1.1rem; }
    .thank-you .button { margin-top: 1.5rem; }
  </style>
</body>
</html>
